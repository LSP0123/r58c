name: Build Armbian image (manual)

# 手动触发，调用 armbian/build 框架为 lz-rk58ch 构建完整 Armbian 镜像，
# 并在构建结束后自动把镜像发布到本仓库的 GitHub Releases（不落本地）。
#
# 默认参数已固化（用户指定）：
#   release=trixie、kernel_repo=https://github.com/LSP0123/linux-rockchip、
#   kernel_branch=rk-6.1-rkr7.2-lz-rk58ch（携带 rk3588-lz-rk58ch.dts 提交）
#
# 每次运行产出 4 个变体（matrix 并行）：minimal + desktop(gnome/kde/xfce)。
# Release 标题 = 本次编译开始时间 yyyymmdd-hhmm（UTC）；镜像以 xz 压缩
# 直接作为 release 资产上传，压缩选项参考 armbian 官方 distro-build 流程。
# 单镜像构建约 40~90 分钟，desktop(full tier) 更久。

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Armbian userspace release'
        required: true
        default: 'trixie'
        type: choice
        options:
          - bookworm
          - trixie
          - noble
          - resolute
      kernel_repo:
        description: 'Kernel repo containing the DTS commit (fork of armbian/linux-rockchip)'
        required: false
        default: 'https://github.com/LSP0123/linux-rockchip'
      kernel_branch:
        description: 'Kernel branch containing the DTS commit'
        required: false
        default: 'rk-6.1-rkr7.2-lz-rk58ch'
      desktop_tier:
        description: 'Desktop package tier (minimal/mid/full)'
        required: false
        default: 'full'
        type: choice
        options:
          - minimal
          - mid
          - full
      variants:
        description: 'Image variants: comma list of minimal/desktop-gnome/desktop-kde/desktop-xfce (empty = all four)'
        required: false
        default: 'desktop-gnome'
        type: string

permissions:
  contents: write   # 发布 release 需要

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单一入口：取统一的编译开始时间戳，作为 release 标题（yyyymmdd-hhmm）
  timestamp:
    name: Determine release timestamp
    runs-on: ubuntu-latest
    outputs:
      reltitle: ${{ steps.ts.outputs.reltitle }}
      reldate: ${{ steps.ts.outputs.reldate }}
    steps:
      - name: Timestamp
        id: ts
        run: |
          echo "reltitle=$(date -u +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "reldate=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

  # 依据 variants 输入项筛选 matrix（空 = 全部四个；本次用户指定仅 gnome）
  matrix_prep:
    name: Prepare image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - name: Build matrix JSON
        id: mk
        run: |
          ALL='[
            {"variant":"minimal","build_minimal":"yes","build_desktop":"no"},
            {"variant":"desktop-gnome","build_minimal":"no","build_desktop":"yes","desktop_environment":"gnome"},
            {"variant":"desktop-kde","build_minimal":"no","build_desktop":"yes","desktop_environment":"kde-plasma"},
            {"variant":"desktop-xfce","build_minimal":"no","build_desktop":"yes","desktop_environment":"xfce"}
          ]'
          WANT_CLEAN=$(echo '${{ inputs.variants }}' | tr -d '[:space:]')
          if [ -z "$WANT_CLEAN" ]; then
            MATRIX="$ALL"
          else
            MATRIX=$(echo "$ALL" | jq -c --arg want "$WANT_CLEAN" '
              ($want | split(",") | map(select(length > 0))) as $wanted
                | [ .[] | select(.variant as $v | ($wanted | any(. == $v or ($v | endswith("-" + .))))) ]
                ')
          fi
          echo "$MATRIX" | jq -e 'length > 0' >/dev/null || {
            echo "::error::variants 输入无效，过滤后没有任何变体"; exit 1;
          }
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> $GITHUB_OUTPUT
          echo "selected: $(echo "$MATRIX" | jq -r '[.[].variant] | join(", ")')"

  build-image:
    name: Image ${{ matrix.variant }}
    needs: [ timestamp, matrix_prep ]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - name: Checkout submission repo
        uses: actions/checkout@v4

      - name: Pre-flight check for kernel inputs
        run: |
          if [ -z "${{ inputs.kernel_repo }}" ]; then
            echo "::error::kernel_repo 为空（默认值被清空）。官方 rk-6.1-rkr7.2 分支还没有 rk3588-lz-rk58ch.dts，"
            echo "::error::不指定携带 DTS 提交的 fork 分支会在打包阶段失败。"
            echo "::error::请填回 https://github.com/LSP0123/linux-rockchip 后重新运行。"
            exit 1
          fi

      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                       /usr/local/graalvm /opt/hostedtoolcache/CodeQL \
                       /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      # 跨架构构建（arm64 目标 / amd64 runner）：必须在宿主机注册 QEMU binfmt。
      # Armbian 的构建容器无 --privileged，自己执行 update-binfmts 会失败，
      # arch-test 'arm64' 不通过后在 prepare_host 阶段直接退出。
      # 宿主机注册的 handler（F 标志内嵌解释器）对全部容器可见。
      # platforms: all 同时覆盖 armbian 想注册的 arm/aarch64/riscv64/loongarch64。
      - name: Set up QEMU for cross-arch build
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Checkout armbian/build (main)
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          path: build

      - name: Install the board file (+ kernel/u-boot source override for testing)
        run: |
          cp armbian-build/config/boards/lz-rk58ch.csc build/config/boards/
          # Board-file hooks reference ${SRC}/packages/<deb> for bundled debs
          # (e.g. install_deb_chroot in post_family_tweaks__lz_rk58ch_touch_wake_helper);
          # ${SRC} is the armbian/build checkout, so mirror the repo's package
          # archive into it before the build starts.
          if [ -d armbian-build/packages ]; then
            mkdir -p build/packages
            cp -v armbian-build/packages/*.deb build/packages/
          fi
          if [ -n "${{ inputs.kernel_repo }}" ]; then
            printf '\n# testing only: use the fork that carries the DTS commit\n' >> build/config/boards/lz-rk58ch.csc
            printf 'function post_family_config__lz_rk58ch_kernel_source_for_testing() {\n' >> build/config/boards/lz-rk58ch.csc
            printf '\tdeclare -g KERNELSOURCE="%s"\n' "${{ inputs.kernel_repo }}" >> build/config/boards/lz-rk58ch.csc
            printf '\tdeclare -g KERNELBRANCH="branch:%s"\n' "${{ inputs.kernel_branch }}" >> build/config/boards/lz-rk58ch.csc
            printf '}\n' >> build/config/boards/lz-rk58ch.csc
          fi
          # U-Boot: dedicated board defconfig lives in the fork of radxa/u-boot
          # (branch next-dev-v2024.10-lz-rk58ch). The interim rock-5b defconfig
          # boots nowhere: it silences the console (CONFIG_DISABLE_CONSOLE) and
          # brings up pcie3x4/pcie30phy which this board does not have.
          printf '\n# board-specific U-Boot (UART2-M2 console, no PCIe)\n' >> build/config/boards/lz-rk58ch.csc
          printf 'function post_family_config__lz_rk58ch_uboot_source() {\n' >> build/config/boards/lz-rk58ch.csc
          printf '\tdeclare -g BOOTSOURCE="https://github.com/LSP0123/u-boot.git"\n' >> build/config/boards/lz-rk58ch.csc
          printf '\tdeclare -g BOOTBRANCH="branch:next-dev-v2024.10-lz-rk58ch"\n' >> build/config/boards/lz-rk58ch.csc
          printf '\tdeclare -g BOOTCONFIG="lz-rk58ch-rk3588_defconfig"\n' >> build/config/boards/lz-rk58ch.csc
          printf '}\n' >> build/config/boards/lz-rk58ch.csc
          cat build/config/boards/lz-rk58ch.csc

      - name: Build the image
        working-directory: build
        run: |
          # Current armbian/build CLI: 'create' was removed; 'build' is the
          # full-image command (auto-relaunches into the official Docker
          # builder container on GitHub runners, host deps included).
          #
          # CI has no tty: every interactive dialog must be answered in
          # advance, or the build dies with "stdin is not a terminal":
          #   KERNEL_CONFIGURE=no     - skip "Select the kernel configuration"
          #   BUILD_MINIMAL/BUILD_DESKTOP explicit - skip image-type dialogs
          #   DESKTOP_ENVIRONMENT + DESKTOP_TIER explicit (desktop variants) -
          #     skip "Choose a desktop environment" / "Choose desktop tier";
          #     FULL_DESKTOP in board files is legacy, pass DESKTOP_TIER directly.
          #
          # COMPRESS_OUTPUTIMAGE=sha,xz: compress the image to .img.xz at build
          # end (same option the official distro-build matrix uses, with sha256).
          EXTRA_ARGS=""
          if [ "${{ matrix.build_desktop }}" = "yes" ]; then
            EXTRA_ARGS="DESKTOP_ENVIRONMENT=${{ matrix.desktop_environment }} DESKTOP_TIER=${{ inputs.desktop_tier }}"
          fi
          ./compile.sh build \
            BOARD=lz-rk58ch \
            BRANCH=vendor \
            RELEASE=${{ inputs.release }} \
            KERNEL_CONFIGURE=no \
            BUILD_MINIMAL=${{ matrix.build_minimal }} \
            BUILD_DESKTOP=${{ matrix.build_desktop }} \
            BUILD_STABLE=no \
            EXPERT=yes \
            KERNEL_GIT_CACHE_TTL=300 \
            COMPRESS_OUTPUTIMAGE=sha,xz \
            $EXTRA_ARGS

      - name: Collect image outputs
        id: outputs
        run: |
          mkdir -p release-assets
          ls -lh build/output/images/ || true
          # 镜像（xz 压缩）+ sha256 校验 + 板卡 dtb（如框架一并产出）
          find build/output/images/ -maxdepth 1 -type f \
            \( -name '*.img.xz' -o -name '*.img.xz.sha' -o -name '*.img' -o -name '*.img.sha' -o -name '*.dtb' \) \
            -exec cp {} release-assets/ \;
          echo "files:"; ls -lh release-assets/
          if [ -z "$(ls release-assets/ 2>/dev/null)" ]; then
            echo "::warning::未发现镜像产物，跳过发布（仍保留日志 artifact）"
          fi

      - name: Upload as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: armbian-lz-rk58ch-image-${{ matrix.variant }}
          path: release-assets/*
          if-no-files-found: ignore
          retention-days: 7

      # 直接发布到 release：每个变体把自己的资产追加到同一个 release
      # （tag=标题=时间戳），ncipollo/release-action 的 allowUpdates 模式
      # 允许四个并行 job 依次合并资产，全部保留。
      - name: Publish images to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.timestamp.outputs.reltitle }}
          name: ${{ needs.timestamp.outputs.reltitle }}
          body: |
            Armbian image for **LX-R58CH V10** (`lz-rk58ch`, Rockchip RK3588)

            - Build started: ${{ needs.timestamp.outputs.reldate }}
            - Kernel: `${{ inputs.kernel_branch }}` from ${{ inputs.kernel_repo }}
            - Userspace: ${{ inputs.release }} (vendor branch)
            - Asset `${{ matrix.variant }}` produced by this run

            烧写：`xz -d` 解压后用 dd / balenaEtcher / rkdeveloptool 写入 eMMC 或 SD。
          prerelease: false
          allowUpdates: true
          removeArtifacts: false
          updateOnlyUnreleased: false
          artifacts: release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-lz-rk58ch-logs-${{ matrix.variant }}
          path: |
            build/output/logs/**
            build/logs/**
          if-no-files-found: ignore
          retention-days: 7

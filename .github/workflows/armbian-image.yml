name: Build Armbian image (manual)

# 可选：手动触发，调用 armbian/build 框架为 lz-rk58ch 构建完整 Armbian 镜像。
# 前提：内核 DTS 提交已存在于某个 linux-rockchip 分支（你的 fork 或已合并的上游分支），
# 通过输入参数 kernel_repo / kernel_branch 指向它；否则打包阶段会因缺少 dtb 而失败。
# 镜像构建耗时约 40~90 分钟。

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Armbian userspace release'
        required: true
        default: 'trixie'
        type: choice
        options:
          - bookworm
          - trixie
          - noble
      kernel_repo:
        description: 'Kernel repo containing the DTS commit (your fork of armbian/linux-rockchip), e.g. https://github.com/you/linux-rockchip.git'
        required: false
        default: ''
      kernel_branch:
        description: 'Kernel branch containing the DTS commit'
        required: false
        default: 'rk-6.1-rkr7.2-lz-rk58ch'

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Armbian image for lz-rk58ch
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout submission repo
        uses: actions/checkout@v4

      - name: Pre-flight check for kernel inputs
        run: |
          if [ -z "${{ inputs.kernel_repo }}" ]; then
            echo "::error::镜像构建需要 kernel_repo 输入（携带 DTS 提交的 linux-rockchip fork 地址）。"
            echo "::error::官方 rk-6.1-rkr7.2 分支还没有 rk3588-lz-rk58ch.dts，不填参数会在打包阶段失败。"
            echo "::error::请先把补丁推到你 fork 的分支（见 README 第三节），再带 kernel_repo/kernel_branch 重新运行。"
            exit 1
          fi

      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                       /usr/local/graalvm /opt/hostedtoolcache/CodeQL \
                       /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Checkout armbian/build (main)
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          path: build

      - name: Install the board file (+ optional kernel-source override for testing)
        run: |
          cp armbian-build/config/boards/lz-rk58ch.csc build/config/boards/
          if [ -n "${{ inputs.kernel_repo }}" ]; then
            printf '\n# testing only: use the fork that carries the DTS commit\n' >> build/config/boards/lz-rk58ch.csc
            printf 'function post_family_config__lz_rk58ch_kernel_source_for_testing() {\n' >> build/config/boards/lz-rk58ch.csc
            printf '\tdeclare -g KERNELSOURCE="%s"\n' "${{ inputs.kernel_repo }}" >> build/config/boards/lz-rk58ch.csc
            printf '\tdeclare -g KERNELBRANCH="branch:%s"\n' "${{ inputs.kernel_branch }}" >> build/config/boards/lz-rk58ch.csc
            printf '}\n' >> build/config/boards/lz-rk58ch.csc
          fi
          cat build/config/boards/lz-rk58ch.csc

      - name: Build the image
        working-directory: build
        run: |
          ./compile.sh create \
            BOARD=lz-rk58ch \
            BRANCH=vendor \
            RELEASE=${{ inputs.release }} \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            BUILD_STABLE=no \
            EXPERT=yes \
            KERNEL_GIT_CACHE_TTL=300 \
            COMPRESS_OUTPUTIMAGE=sha

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armbian-lz-rk58ch-image
          path: |
            build/output/images/*.img
            build/output/images/*.img.sha
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-lz-rk58ch-logs
          path: |
            build/output/logs/**
            build/logs/**
          if-no-files-found: ignore
          retention-days: 7

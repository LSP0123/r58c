name: Build Armbian image (manual)

# 手动触发，调用 armbian/build 框架为 lz-rk58ch 构建完整 Armbian 镜像。
# 默认参数已固化（用户指定）：release=trixie、内核用 LSP0123 fork 的
# rk-6.1-rkr7.2-lz-rk58ch 分支（携带 rk3588-lz-rk58ch.dts 提交）。
# 单次运行并行产出两个变体（matrix）：minimal 与 desktop。
# 单个镜像构建约 40~90 分钟（desktop 更久）。

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Armbian userspace release'
        required: true
        default: 'trixie'
        type: choice
        options:
          - bookworm
          - trixie
          - noble
      kernel_repo:
        description: 'Kernel repo containing the DTS commit (fork of armbian/linux-rockchip)'
        required: false
        default: 'https://github.com/LSP0123/linux-rockchip'
      kernel_branch:
        description: 'Kernel branch containing the DTS commit'
        required: false
        default: 'rk-6.1-rkr7.2-lz-rk58ch'

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Armbian image for lz-rk58ch (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: minimal
            build_minimal: 'yes'
            build_desktop: 'no'
          - variant: desktop
            build_minimal: 'no'
            build_desktop: 'yes'
    steps:
      - name: Checkout submission repo
        uses: actions/checkout@v4

      - name: Pre-flight check for kernel inputs
        run: |
          if [ -z "${{ inputs.kernel_repo }}" ]; then
            echo "::error::kernel_repo 为空（默认值被清空）。官方 rk-6.1-rkr7.2 分支还没有 rk3588-lz-rk58ch.dts，"
            echo "::error::不指定携带 DTS 提交的 fork 分支会在打包阶段失败。"
            echo "::error::请填回 https://github.com/LSP0123/linux-rockchip 后重新运行。"
            exit 1
          fi

      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                       /usr/local/graalvm /opt/hostedtoolcache/CodeQL \
                       /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      # 跨架构构建（arm64 目标 / amd64 runner）：必须在宿主机注册 QEMU binfmt。
      # Armbian 的构建容器无 --privileged，自己执行 update-binfmts 会失败，
      # arch-test 'arm64' 不通过后在 prepare_host 阶段直接退出。
      # 宿主机注册的 handler（F 标志内嵌解释器）对全部容器可见。
      # platforms: all 同时覆盖 armbian 想注册的 arm/aarch64/riscv64/loongarch64，
      # 避免容器内残留的多余 Failed-to-update-binfmts 错误注解。
      - name: Set up QEMU for cross-arch build
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Checkout armbian/build (main)
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          path: build

      - name: Install the board file (+ kernel-source override for testing)
        run: |
          cp armbian-build/config/boards/lz-rk58ch.csc build/config/boards/
          if [ -n "${{ inputs.kernel_repo }}" ]; then
            printf '\n# testing only: use the fork that carries the DTS commit\n' >> build/config/boards/lz-rk58ch.csc
            printf 'function post_family_config__lz_rk58ch_kernel_source_for_testing() {\n' >> build/config/boards/lz-rk58ch.csc
            printf '\tdeclare -g KERNELSOURCE="%s"\n' "${{ inputs.kernel_repo }}" >> build/config/boards/lz-rk58ch.csc
            printf '\tdeclare -g KERNELBRANCH="branch:%s"\n' "${{ inputs.kernel_branch }}" >> build/config/boards/lz-rk58ch.csc
            printf '}\n' >> build/config/boards/lz-rk58ch.csc
          fi
          cat build/config/boards/lz-rk58ch.csc

      - name: Build the image
        working-directory: build
        run: |
          # Current armbian/build CLI: 'create' was removed; 'build' is the
          # full-image command (auto-relaunches into the official Docker
          # builder container on GitHub runners, host deps included).
          #
          # CI has no tty: every interactive dialog must be answered in
          # advance, or the build dies with "stdin is not a terminal":
          #   KERNEL_CONFIGURE=no     - skip "Select the kernel configuration"
          #   BUILD_MINIMAL/BUILD_DESKTOP explicit - skip "Select the target image type"
          #   BUILD_MINIMAL explicit  - skip standard-vs-minimal dialog
          #   DESKTOP_ENVIRONMENT + DESKTOP_TIER explicit (desktop variant) -
          #     skip "Choose a desktop environment" / "Choose desktop tier";
          #     FULL_DESKTOP in board files is a legacy var the framework no
          #     longer maps to a tier, so pass DESKTOP_TIER=full directly.
          EXTRA_ARGS=""
          if [ "${{ matrix.variant }}" = "desktop" ]; then
            EXTRA_ARGS="DESKTOP_ENVIRONMENT=xfce DESKTOP_TIER=full"
          fi
          ./compile.sh build \
            BOARD=lz-rk58ch \
            BRANCH=vendor \
            RELEASE=${{ inputs.release }} \
            KERNEL_CONFIGURE=no \
            BUILD_MINIMAL=${{ matrix.build_minimal }} \
            BUILD_DESKTOP=${{ matrix.build_desktop }} \
            BUILD_STABLE=no \
            EXPERT=yes \
            KERNEL_GIT_CACHE_TTL=300 \
            COMPRESS_OUTPUTIMAGE=sha \
            $EXTRA_ARGS

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armbian-lz-rk58ch-image-${{ matrix.variant }}
          path: |
            build/output/images/*.img
            build/output/images/*.img.sha
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-lz-rk58ch-logs-${{ matrix.variant }}
          path: |
            build/output/logs/**
            build/logs/**
          if-no-files-found: ignore
          retention-days: 7
